<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>색 조합 스피드 퍼즐 - 프로토타입</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF4EF;
    --panel:#FFFFFF;
    --ink:#1F3A32;
    --red:#FF6B6B;
    --blue:#4D96FF;
    --yellow:#FFD93D;
    --purple:#B983FF;
    --orange:#FF9F45;
    --green:#6BCB77;
    --muted:#7D9C90;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);font-family:'Fredoka',sans-serif;color:var(--ink);overflow:hidden;}
  #app{
    max-width:420px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:14px 14px 20px;
    position:relative;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .stat{
    background:var(--panel);
    border-radius:14px;
    padding:8px 14px;
    box-shadow:0 2px 0 rgba(31,58,50,0.08);
  }
  .stat .label{font-size:11px;color:var(--muted);letter-spacing:.02em;}
  .stat .value{font-size:20px;font-weight:700;line-height:1;}
  #timerWrap{flex:1;margin:0 10px;height:8px;background:#DCEAE3;border-radius:6px;overflow:hidden;}
  #timerBar{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));transition:width .2s linear;}

  #beat{
    width:14px;height:14px;border-radius:50%;
    background:var(--muted);
    margin:0 auto 10px;
    transition:transform .08s ease, background .08s ease;
  }
  #beat.on{background:var(--orange);transform:scale(1.8);}

  #legend{
    display:flex;
    justify-content:center;
    gap:10px;
    background:var(--panel);
    border-radius:12px;
    padding:6px 8px;
    margin-bottom:8px;
    box-shadow:0 2px 0 rgba(31,58,50,0.08);
  }
  .legendItem{
    display:flex;align-items:center;gap:2px;
    font-size:11px;font-weight:600;color:var(--muted);
  }
  .dotc{width:14px;height:14px;border-radius:50%;display:inline-block;}

  .cell.shake{animation:shake .3s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  #grid{
    flex:1;
    touch-action:none;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:6px;
    background:var(--panel);
    border-radius:20px;
    padding:8px;
    box-shadow:0 4px 0 rgba(31,58,50,0.08);
  }
  .cell{
    position:relative;
    touch-action:none;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .cell.selected{transform:scale(0.88);box-shadow:0 0 0 3px var(--ink) inset;}
  .cell .bud{
    width:78%;height:78%;border-radius:50%;
    transition:transform .18s ease;
  }
  .cell.pop .bud{animation:bloom .35s ease forwards;}
  @keyframes bloom{
    0%{transform:scale(1);}
    45%{transform:scale(1.5) rotate(20deg);}
    100%{transform:scale(1);}
  }
  .cell.dropping{animation:dropin .25s ease;}
  @keyframes dropin{
    from{transform:translateY(-40px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }

  #garden{
    margin-top:10px;
    display:flex;
    gap:5px;
    overflow-x:auto;
    padding:4px 2px;
    min-height:26px;
  }
  #garden .dot{width:16px;height:16px;border-radius:50%;flex:none;}

  #floater{
    position:absolute;
    font-weight:700;
    font-size:14px;
    pointer-events:none;
    animation:floatup .6s ease forwards;
    color:var(--ink);
  }
  @keyframes floatup{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-30px);opacity:0;}
  }

  #endScreen{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#EAF4EF,#D9F0E4);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    border-radius:20px;
  }
  #endScreen h1{font-size:22px;margin:0 0 4px;}
  #endScreen p{color:var(--muted);margin:0 0 16px;font-size:14px;}
  #gardenFinal{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
    width:100%;
    max-width:280px;
    margin-bottom:20px;
  }
  #gardenFinal .dot{width:100%;aspect-ratio:1;border-radius:50%;}
  #retryBtn{
    background:var(--ink);
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:14px;
    font-family:'Fredoka',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
  }
  #startScreen{
    position:absolute;inset:0;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
    border-radius:20px;
  }
  #startScreen h1{font-size:24px;margin:0 0 8px;}
  #startScreen p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 22px;max-width:260px;}
  #startBtn{
    background:var(--purple);
    color:#fff;
    border:none;
    padding:14px 32px;
    border-radius:16px;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
  }
  #modeToggle{
    margin-top:18px;
    display:flex;
    background:var(--panel);
    border-radius:12px;
    padding:3px;
    gap:3px;
  }
  #modeToggle button{
    border:none;background:transparent;
    padding:7px 14px;border-radius:9px;
    font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;
    color:var(--muted);cursor:pointer;
  }
  #modeToggle button.active{background:var(--ink);color:#fff;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <div class="stat"><div class="label">TIME</div><div class="value" id="timeVal">60</div></div>
  </header>
  <div id="beat"></div>
  <div id="legend">
    <div class="legendItem"><span class="dotc" style="background:var(--red)"></span>+<span class="dotc" style="background:var(--blue)"></span>=<span class="dotc" style="background:var(--purple)"></span></div>
    <div class="legendItem"><span class="dotc" style="background:var(--red)"></span>+<span class="dotc" style="background:var(--yellow)"></span>=<span class="dotc" style="background:var(--orange)"></span></div>
    <div class="legendItem"><span class="dotc" style="background:var(--blue)"></span>+<span class="dotc" style="background:var(--yellow)"></span>=<span class="dotc" style="background:var(--green)"></span></div>
  </div>
  <div id="grid"></div>
  <div id="garden"></div>

  <div id="startScreen">
    <h1>🌸 색 조합 스피드 퍼즐</h1>
    <p>다른 색 블록 두 개를 옆으로 붙이면 자동으로 합쳐져 꽃이 됩니다.<br>박자에 맞춰 합치면 점수 2배!<br>60초 동안 최대한 많이 피워보세요.</p>
    <button id="startBtn">시작하기</button>
    <div id="modeToggle">
      <button id="modeTap">탭 모드</button>
      <button id="modeSwipe" class="active">스와이프 모드</button>
    </div>
  </div>

  <div id="endScreen">
    <h1>정원이 완성됐어요</h1>
    <p id="endSub">최종 점수 0</p>
    <div id="gardenFinal"></div>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
const COLORS = {
  red: getComputedStyle(document.documentElement).getPropertyValue('--red').trim(),
  blue: getComputedStyle(document.documentElement).getPropertyValue('--blue').trim(),
  yellow: getComputedStyle(document.documentElement).getPropertyValue('--yellow').trim(),
};
const MERGE = {
  'red,blue': {name:'purple', color: getComputedStyle(document.documentElement).getPropertyValue('--purple').trim()},
  'red,yellow': {name:'orange', color: getComputedStyle(document.documentElement).getPropertyValue('--orange').trim()},
  'blue,yellow': {name:'green', color: getComputedStyle(document.documentElement).getPropertyValue('--green').trim()},
};
const PRIMARIES = Object.keys(COLORS);

const SIZE = 6;
let board = []; // {key, el}
let selected = null;
let score = 0;
let timeLeft = 60;
let running = false;
let timerInterval = null;
let beatInterval = null;
let lastBeatTime = 0;
let gardenCount = 0;
let inputMode = 'swipe'; // or tap
let dragStart = null;

const grid = document.getElementById('grid');
const scoreVal = document.getElementById('scoreVal');
const timeVal = document.getElementById('timeVal');
const timerBar = document.getElementById('timerBar');
const beatDot = document.getElementById('beat');
const gardenBar = document.getElementById('garden');
const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');
const gardenFinal = document.getElementById('gardenFinal');
const endSub = document.getElementById('endSub');

function randomPrimary(){
  return PRIMARIES[Math.floor(Math.random()*PRIMARIES.length)];
}

function mergeKey(a,b){
  return [a,b].sort().join(',');
}

function buildBoard(){
  grid.innerHTML = '';
  board = [];
  for(let i=0;i<SIZE*SIZE;i++){
    const key = randomPrimary();
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    const bud = document.createElement('div');
    bud.className = 'bud';
    bud.style.background = COLORS[key];
    cell.appendChild(bud);
    grid.appendChild(cell);
    board.push({key, el:cell, bud});
    attachHandlers(cell, i);
  }
}

function attachHandlers(cell, i){
  cell.addEventListener('click', ()=> handleTap(i));
  cell.addEventListener('touchstart', (e)=>{
    if(inputMode!=='swipe') return;
    dragStart = i;
  }, {passive:true});
  cell.addEventListener('touchend', (e)=>{
    if(inputMode!=='swipe' || dragStart===null) return;
    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if(el && el.closest('.cell')){
      const endIdx = parseInt(el.closest('.cell').dataset.index);
      if(isAdjacent(dragStart, endIdx)) tryMerge(dragStart, endIdx);
      else failShake(dragStart, endIdx);
    }
    dragStart = null;
  });
}

function isAdjacent(a,b){
  const ra = Math.floor(a/SIZE), ca = a%SIZE;
  const rb = Math.floor(b/SIZE), cb = b%SIZE;
  return (Math.abs(ra-rb)+Math.abs(ca-cb))===1;
}

function handleTap(i){
  if(!running) return;
  if(inputMode==='swipe') return; // swipe handled separately
  if(selected===null){
    selected = i;
    board[i].el.classList.add('selected');
    return;
  }
  if(selected===i){
    board[i].el.classList.remove('selected');
    selected = null;
    return;
  }
  if(isAdjacent(selected,i)){
    tryMerge(selected,i);
  } else {
    failShake(selected,i);
  }
  board[selected].el.classList.remove('selected');
  selected = null;
}

function onBeat(){
  return (Date.now()-lastBeatTime) < 260; // timing window
}

function showFloater(cell, text){
  const rect = cell.getBoundingClientRect();
  const appRect = document.getElementById('app').getBoundingClientRect();
  const f = document.createElement('div');
  f.id='floater';
  f.textContent = text;
  f.style.left = (rect.left-appRect.left+rect.width/2-10)+'px';
  f.style.top = (rect.top-appRect.top)+'px';
  document.getElementById('app').appendChild(f);
  setTimeout(()=>f.remove(),600);
}

function tryMerge(a,b){
  const ka = board[a].key, kb = board[b].key;
  if(ka===kb || !PRIMARIES.includes(ka) || !PRIMARIES.includes(kb)){
    failShake(a,b);
    return false;
  }
  const mk = mergeKey(ka,kb);
  const merged = MERGE[mk];
  if(!merged){
    failShake(a,b);
    return false;
  }

  const beat = onBeat();
  const points = beat ? 20 : 10;
  score += points;
  scoreVal.textContent = score;
  showFloater(board[b].el, beat ? '+'+points+' 박자!' : '+'+points);

  // target cell becomes the merged flower, source becomes empty->refills
  board[b].bud.style.background = merged.color;
  board[b].key = 'bloomed';
  board[b].el.classList.add('pop');
  setTimeout(()=>board[b].el.classList.remove('pop'),350);
  addToGarden(merged.color);

  // source cell: refill with new primary, drop animation
  board[a].key = randomPrimary();
  board[a].bud.style.background = COLORS[board[a].key];
  board[a].el.classList.add('dropping');
  setTimeout(()=>board[a].el.classList.remove('dropping'),250);

  // after short delay, bloomed cell resets to a new primary (keeps game going)
  setTimeout(()=>{
    board[b].key = randomPrimary();
    board[b].bud.style.background = COLORS[board[b].key];
    board[b].el.classList.add('dropping');
    setTimeout(()=>board[b].el.classList.remove('dropping'),250);
  }, 380);
  return true;
}

function failShake(a,b){
  [a,b].forEach(idx=>{
    board[idx].el.classList.add('shake');
    setTimeout(()=>board[idx].el.classList.remove('shake'),300);
  });
}

function addToGarden(color){
  gardenCount++;
  const dot = document.createElement('div');
  dot.className='dot';
  dot.style.background=color;
  gardenBar.appendChild(dot);
  gardenBar.scrollLeft = gardenBar.scrollWidth;
}

function startBeat(){
  lastBeatTime = Date.now();
  beatInterval = setInterval(()=>{
    lastBeatTime = Date.now();
    beatDot.classList.add('on');
    setTimeout(()=>beatDot.classList.remove('on'),160);
  }, 900);
}

function startGame(){
  score=0; timeLeft=60; gardenCount=0; selected=null;
  scoreVal.textContent='0';
  timeVal.textContent='60';
  timerBar.style.width='100%';
  gardenBar.innerHTML='';
  buildBoard();
  startScreen.style.display='none';
  endScreen.style.display='none';
  running=true;
  startBeat();
  timerInterval = setInterval(()=>{
    timeLeft--;
    timeVal.textContent = timeLeft;
    timerBar.style.width = (timeLeft/60*100)+'%';
    if(timeLeft<=0) endGame();
  },1000);
}

function endGame(){
  running=false;
  clearInterval(timerInterval);
  clearInterval(beatInterval);
  endSub.textContent = '최종 점수 '+score+' · 피운 꽃 '+gardenCount+'송이';
  gardenFinal.innerHTML='';
  [...gardenBar.children].forEach(d=>{
    const dot=document.createElement('div');
    dot.className='dot';
    dot.style.background=d.style.background;
    gardenFinal.appendChild(dot);
  });
  endScreen.style.display='flex';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('modeTap').addEventListener('click', ()=>{
  inputMode='tap';
  document.getElementById('modeTap').classList.add('active');
  document.getElementById('modeSwipe').classList.remove('active');
});
document.getElementById('modeSwipe').addEventListener('click', ()=>{
  inputMode='swipe';
  document.getElementById('modeSwipe').classList.add('active');
  document.getElementById('modeTap').classList.remove('active');
});

buildBoard();
</script>
</body>
</html>
