<body><h1>CRAYON BLOOM RC · 개발 검수</h1>
<p>실제 게임 iframe에서 합성 PointerEvent를 실행합니다. Android 손맛·물리 포인터 캡처·실기기 오디오 검사가 아닙니다. 테스트 저장은 메모리 사본에만 기록합니다. 정식 게임 UI에는 이 페이지가 표시되지 않습니다.</p>
<div class="tools"><label>화면 크기 <select id="viewport" aria-label="검수 화면 크기"><option value="360,640">360 × 640</option><option value="390,844" selected>390 × 844</option><option value="412,915">412 × 915</option></select></label><button id="fresh-load">완전 신규 사용자 불러오기</button><button id="reload">검수 게임 새로고침</button><button id="home">홈 화면</button><button id="game">게임 화면</button><button id="over">게임오버 화면</button><button id="snapshot">상태 기록</button></div>

<div class="layout"><iframe id="game-frame" title="RC 검수 게임 390 × 844" src="../index.html?qa=1&amp;rc_review=1"></iframe><div class="results"><details open><summary>검사 결과</summary><pre id="report">준비 중</pre></details><details open><summary>실시간 10 / 20 / 30분 샘플</summary><pre id="soak-report">미실행 — 자동 가속 시간이 아닌 실제 경과 시간을 기록합니다.</pre></details></div></div>
<script>
'use strict';
const frame=document.getElementById('game-frame'),out=document.getElementById('report'),statusEl=document.getElementById('status'),soakOut=document.getElementById('soak-report');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let w,q,ready=false,busy=false,monitor=null,stopRequested=false,soakTimer=null,soakData=null,firstInstallBoot=null;
function assert(ok,message){if(!ok)throw Error(message);}
function rounded(v){return Number.isFinite(v)?Math.round(v*100)/100:v;}
function setStatus(s){statusEl.textContent=s;}
function write(data){out.textContent=JSON.stringify(data,null,2);}
function controls(lock){busy=lock;for(const id of ['regression','lifecycle','effects','soak','reload','home','game','over','tutorial-flow','tutorial-screen','loading-screen','geometry','fresh-load'])document.getElementById(id).disabled=lock;document.getElementById('stop').disabled=!lock;}
function sandboxStorage(win){
 const source=win.localStorage,copy=new Map();for(let i=0;i<source.length;i++){const key=source.key(i);copy.set(key,source.getItem(key));}
 const memory={get length(){return copy.size;},key:i=>[...copy.keys()][i]??null,getItem:k=>copy.has(String(k))?copy.get(String(k)):null,setItem:(k,v)=>copy.set(String(k),String(v)),removeItem:k=>copy.delete(String(k)),clear(){throw Error('QA never clears storage');}};
 Object.defineProperty(win,'localStorage',{configurable:true,value:memory});return copy;
}
function instrument(win){
 const m={timers:new Map(),errors:[],longTasks:0,maxLongTask:0,frames:0,frameSum:0,maxFrame:0,over50:0,frameRing:[],hiddenSamples:0,maxTimers:0,active:true};
 const originals={setTimeout:win.setTimeout.bind(win),clearTimeout:win.clearTimeout.bind(win),setInterval:win.setInterval.bind(win),clearInterval:win.clearInterval.bind(win)};
 win.setTimeout=function(fn,ms,...args){let id;id=originals.setTimeout(()=>{m.timers.delete(id);if(typeof fn==='function')fn(...args);else m.errors.push('Unexpected string timeout');},ms);m.timers.set(id,{kind:'timeout',ms});m.maxTimers=Math.max(m.maxTimers,m.timers.size);return id;};
 win.clearTimeout=function(id){m.timers.delete(id);originals.clearTimeout(id);};
 win.setInterval=function(fn,ms,...args){const id=originals.setInterval(fn,ms,...args);m.timers.set(id,{kind:'interval',ms});m.maxTimers=Math.max(m.maxTimers,m.timers.size);return id;};
 win.clearInterval=function(id){m.timers.delete(id);originals.clearInterval(id);};
 const error=s=>{if(m.errors.length<30)m.errors.push(String(s));};
 win.addEventListener('error',e=>error(e.message||'Resource error: '+(e.target?.src||e.target?.href||e.target?.tagName)),true);
 win.addEventListener('unhandledrejection',e=>error('Unhandled: '+String(e.reason)));
 try{m.observer=new win.PerformanceObserver(list=>{for(const e of list.getEntries()){m.longTasks++;m.maxLongTask=Math.max(m.maxLongTask,e.duration);}});m.observer.observe({type:'longtask',buffered:false});}catch{}
 let last=0;function tick(t){if(!m.active)return;if(last){const dt=t-last;m.frames++;m.frameSum+=dt;m.maxFrame=Math.max(m.maxFrame,dt);if(dt>50)m.over50++;m.frameRing.push(dt);if(m.frameRing.length>3600)m.frameRing.shift();}if(win.document.hidden)m.hiddenSamples++;last=t;m.raf=win.requestAnimationFrame(tick);}m.raf=win.requestAnimationFrame(tick);
 m.stop=()=>{m.active=false;m.observer?.disconnect();win.cancelAnimationFrame(m.raf);};return m;
}
function snapshot(){
 const ring=[...(monitor?.frameRing||[])].sort((a,b)=>a-b),doc=w.document,memory=w.performance.memory;
 const broken=[...doc.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.currentSrc||i.src);
 return {version:doc.getElementById('build')?.textContent,state:q.state,viewport:{width:frame.clientWidth,height:frame.clientHeight},visibility:doc.visibilityState,storage:firstInstallBoot?'empty-memory before application boot':'isolated in-memory copy',firstInstallBoot,
  pointer:q.drag?{state:q.drag.state,side:q.drag.side,steps:q.drag.steps,timer:q.drag.timer!=null}:null,
  DOM:doc.querySelectorAll('*').length,homeAnimations:doc.getAnimations().filter(a=>a.effect?.target?.closest?.('.cb-home')).length,
  audio:w.BloomAudio?.stats?.()||'unavailable',celebration:q.celebration?.stats?.()||'unavailable',tutorial:q.tutorial?.stats?.()||'unavailable',training:q.training,loading:q.loading?.stats?.()||'unavailable',
  timers:{tracked:monitor.timers.size,peak:monitor.maxTimers,scope:'post-load timers only; module stats cover preexisting ownership'},
  frames:{count:monitor.frames,averageFPS:monitor.frameSum?rounded(monitor.frames*1000/monitor.frameSum):null,recentMedianMs:rounded(ring[Math.floor(ring.length*.5)]),recentP95Ms:rounded(ring[Math.floor(ring.length*.95)]),maxMs:rounded(monitor.maxFrame),over50:monitor.over50,hiddenFrameSamples:monitor.hiddenSamples},
  mainThread:{longTasks:monitor.longTasks,maxLongTaskMs:rounded(monitor.maxLongTask)},heapBytes:memory?.usedJSHeapSize??'NOT AVAILABLE',errors:[...monitor.errors],brokenImages:broken};
}
function prepare(){assert(ready&&q,'게임 준비 후 다시 실행하세요');q.start();if(q.items)q.items.practice=true;q.adaptive?.exclude?.();}
function emit(target,type,x,y,id=701,extra={}){
 const capture=target.setPointerCapture;target.setPointerCapture=()=>{};
 try{return target.dispatchEvent(new w.PointerEvent(type,{pointerId:id,pointerType:'touch',isPrimary:id===701,button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y,bubbles:true,cancelable:true,...extra}));}
 finally{target.setPointerCapture=capture;}
}
function board(){return w.document.getElementById('board');}
function point(side=-1){const r=board().getBoundingClientRect();return{x:r.left+r.width*(side<0?.25:.75),y:r.top+r.height*.42};}
function pointer(type,p,id=701,target=board()){emit(target,type,p.x,p.y,id);}
function observe(){const g=q.run,calls=[],start=performance.now(),originals={};for(const name of ['move','rotateDir','hold','lock']){originals[name]=g[name];g[name]=function(...args){const before=this.active?.x,result=originals[name].apply(this,args);if(name!=='move'||args[0])calls.push({name,args,at:rounded(performance.now()-start),result,before,after:this.active?.x});return result;};}return{calls,start,restore(){for(const name of Object.keys(originals))g[name]=originals[name];}};}
function alive(){if(stopRequested)throw Error('사용자가 검사를 중지했습니다');}
async function runTask(name,fn){if(busy)return;controls(true);stopRequested=false;setStatus(name+' 실행 중');try{const result=await fn(),verdict=result?.result||'PASS';write({test:name,input:'browser synthetic PointerEvent; native capture not tested',result:verdict,...result});setStatus(name+' '+verdict+' — Android 실기기 미검증');}catch(e){write({test:name,result:'FAIL',error:String(e),snapshot:ready?snapshot():null});setStatus(name+' FAIL');}finally{try{q?.pause();}catch{}controls(false);}}
async function regression(){
 const results=[],traces=[];const group=async(name,count,fn)=>{for(let i=0;i<count;i++){alive();setStatus(`${name} ${i+1}/${count}`);await fn(i);}results.push({name,count,result:'PASS'});};
 for(const side of [-1,1]){
  await group(side<0?'TAP LEFT':'TAP RIGHT',30,async()=>{prepare();const p=point(side),x=q.run.active.x,o=observe();try{pointer('pointerdown',p);await wait(12);pointer('pointerup',p);assert(q.run.active.x===x+side,'tap must move exactly one cell');assert(o.calls.length===1,'tap duplicate');await wait(6);assert(o.calls.length===1,'tap trailing action');}finally{o.restore();}});
  await group(side<0?'LONG LEFT':'LONG RIGHT',10,async i=>{prepare();while(q.run.move(-side)){}const p=point(side),o=observe();try{pointer('pointerdown',p);await wait(312);const state=q.drag?.state;pointer('pointerup',p);const n=o.calls.length,up=rounded(performance.now()-o.start);await wait(65);assert(n>=4,'hold did not repeat');assert(o.calls.filter(c=>c.name==='move'&&c.result).length>=4,'hold successful steps missing');assert(o.calls.length===n,'extra move after release');assert(state==='REPEATING','repeat state missing');if(i===0)traces.push({side,down:0,up,moves:o.calls,extraAfterUp:o.calls.length-n});}finally{o.restore();}});
  await group(side<0?'SWIPE LEFT':'SWIPE RIGHT',20,async()=>{prepare();const p=point(side),to={x:p.x+side*60,y:p.y},o=observe();try{pointer('pointerdown',p);await wait(8);pointer('pointermove',to);await wait(180);pointer('pointermove',{x:to.x+side*40,y:to.y});pointer('pointerup',to);assert(o.calls.length===1&&o.calls[0].name==='rotateDir'&&o.calls[0].args[0]===side,'swipe not exactly one rotation');}finally{o.restore();}});
 }
 for(const [dy,name]of[[-70,'hold'],[70,'lock']])await group(name==='hold'?'HOLD':'DROP',20,async()=>{prepare();const p=point(),to={x:p.x,y:p.y+dy},o=observe();try{pointer('pointerdown',p);pointer('pointermove',to);const piece=q.run.active;await wait(180);pointer('pointermove',{x:to.x+70,y:to.y});pointer('pointerup',to);assert(o.calls.filter(c=>c.name===name).length===1,'vertical action count');assert(!o.calls.some(c=>c.name==='move'||c.name==='rotateDir'),'vertical leaked lateral action');assert(q.run.active===piece,'old gesture changed replacement');}finally{o.restore();}});
 await group('MULTITOUCH DROP',20,async i=>{prepare();const p=point(i%2?1:-1),o=observe();try{pointer('pointerdown',p);await wait(i%2?180:20);const b=w.document.querySelector('[data-action="drop"]'),r=b.getBoundingClientRect();emit(b,'pointerdown',r.x+r.width/2,r.y+r.height/2,702);emit(b,'pointerup',r.x+r.width/2,r.y+r.height/2,702);b.dispatchEvent(new w.PointerEvent('click',{bubbles:true,cancelable:true,pointerType:'touch',detail:0}));const next=q.run.active,n=o.calls.length;await wait(70);pointer('pointermove',{x:p.x+80,y:p.y});pointer('pointerup',p);assert(o.calls.length===n,'old finger/click moved replacement');assert(o.calls.filter(c=>c.name==='lock').length===1,'drop duplicate');assert(q.run.active===next,'replacement piece changed');}finally{o.restore();}});
 await group('JITTER',2,async i=>{prepare();while(q.run.move(1)){}const p=point(),o=observe();try{pointer('pointerdown',p);for(let n=0;n<8;n++){await wait(40);pointer('pointermove',{x:p.x+(n%2?12:-12),y:p.y+(i?13:3)});}pointer('pointerup',p);assert(o.calls.filter(c=>c.name==='move'&&c.result).length>=4,'jitter interrupted hold');}finally{o.restore();}});
 await group('WALL / RELEASE / PAUSE',2,async i=>{prepare();const side=i?1:-1;while(q.run.move(side)){}const p=point(side),o=observe();try{pointer('pointerdown',p);await wait(240);assert(q.drag?.state==='BLOCKED','wall should block repeat');assert(o.calls.length===1&&!o.calls[0].result,'wall repeat should stop after blocked step');pointer('pointermove',{x:p.x+side*70,y:p.y});const x=q.run.active.x;await wait(80);pointer('pointerup',p);assert(q.run.active.x===x,'wall rotation drift');pointer('pointerdown',p);q.pause();await wait(190);q.resume();pointer('pointerup',p);assert(!q.drag,'pause repeat remains');}finally{o.restore();}});
 return{groups:results,traces,snapshot:snapshot()};
}
async function lifecycle(){const rows=[];for(let i=0;i<10;i++){alive();prepare();q.action('drop');q.pause();assert(q.state==='paused','pause');q.resume();assert(q.state==='playing','resume');q.menu();assert(q.state==='menu','home');prepare();q.finish('qa_lifecycle');assert(q.state==='over','gameover');q.start(true);if(q.items)q.items.practice=true;q.adaptive?.exclude?.();assert(q.state==='playing'&&q.run.score===0,'retry');q.menu();assert(q.state==='menu'&&!q.drag,'final home');await wait(35);rows.push({cycle:i+1,result:'PASS',timers:monitor.timers.size,DOM:w.document.querySelectorAll('*').length});}return{cycles:rows,snapshot:snapshot()};}
async function effects(){prepare();await soundOn();await wait(60);const rows=[];for(const event of [{combo:2,lines:1},{combo:3,lines:1},{combo:4,lines:1},{combo:6,lines:1},{combo:1,lines:4},{best:true}]){alive();q.celebration?.clear();const shown=q.celebration?.celebrate(event);w.BloomAudio?.effect('combo',event.combo||4);const p=point(1),before=q.run.active.x;pointer('pointerdown',p);pointer('pointerup',p);assert(q.run.active.x===before+1,'cutin blocked tap');pointer('pointerdown',point(-1));pointer('pointerup',point(-1));rows.push({event,shown,input:'PASS'});await wait(1000);}return{effects:rows,snapshot:snapshot()};}
async function waitFor(predicate,label,timeout=5000){const start=performance.now();while(!predicate()){alive();if(performance.now()-start>timeout)throw Error('시간 초과: '+label);await wait(25);}}
function tutorialStep(){const s=q.tutorial?.stats?.();return Number.isInteger(s?.index)?s.index:Number.isInteger(s?.step)?s.step:-1;}
function clickUI(selector){const el=w.document.querySelector(selector);assert(el,'실제 UI가 없습니다: '+selector);assert(!el.disabled,'UI 비활성: '+selector);el.click();}
async function tutorialFlow(){
 assert(q.tutorial&&q.loading,'튜토리얼/로딩 모듈이 없습니다');
 const key='glassfall-v1',fresh=!!w.document.querySelector('meta[name="rc-first-install"]');
 if(fresh){assert(firstInstallBoot?.initialEntries===0&&firstInstallBoot?.entries===0&&firstInstallBoot?.writes===0,'앱 최초 부팅 저장이 비어 있지 않았음');assert(q.state==='menu'&&w.localStorage.length===0,'완전 신규 사용자 불러오기를 다시 눌러 주세요');assert(firstInstallBoot.homeBest===0&&firstInstallBoot.tutorialCompleted===false,'신규 홈 최고점/튜토리얼 상태');}
 else{q.menu();const fixture=JSON.parse(w.localStorage.getItem(key)||'{}');fixture.tutorialCompleted=false;fixture.sound=!!w.BloomAudio?.stats?.().sound;fixture.endlessV1=fixture.endlessV1||{};fixture.endlessV1.normal={...fixture.endlessV1.normal,best:Math.max(54321,Number(fixture.endlessV1.normal?.best)||0)};fixture.qaPreservedField='keep';w.localStorage.setItem(key,JSON.stringify(fixture));clickUI('[data-menu="settings"]');clickUI('[data-menu="sound"]');clickUI('[data-menu="sound"]');clickUI('[data-menu="back"]');}
 const before=JSON.parse(w.localStorage.getItem(key)||'{}'),adaptiveBefore=w.localStorage.getItem('glassfall-adaptive-v1');assert(before.tutorialCompleted!==true,'첫 사용자 상태여야 함');
 const start=performance.now();clickUI('[data-menu="start"]');assert(q.state==='loading','시작 버튼에서 로딩을 건너뜀');assert(w.document.querySelector('.cb-loading'),'실제 로딩 화면 없음');
 await waitFor(()=>q.training&&tutorialStep()===0,'첫 사용자 튜토리얼');const firstLoading={actualTransitionMs:rounded(performance.now()-start),...q.loading.stats().last};
 const steps=[];const perform=async(index,name,fn)=>{await waitFor(()=>tutorialStep()===index,name+' 준비');setStatus('튜토리얼 '+(index+1)+' · '+name);await fn();await waitFor(()=>tutorialStep()===index+1,name+' 성공');steps.push({step:index+1,name,result:'PASS'});};
 const tap=side=>{const p=point(side);pointer('pointerdown',p);pointer('pointerup',p);};
 const swipe=(dx,dy)=>{const p=point(),end={x:p.x+dx,y:p.y+dy};pointer('pointerdown',p);pointer('pointermove',end);pointer('pointerup',end);};
 await perform(0,'왼쪽 한 칸',async()=>{tap(1);await wait(80);assert(tutorialStep()===0,'틀린 방향이 성공 처리됨');tap(-1);});
 await perform(1,'오른쪽 한 칸',async()=>tap(1));
 await perform(2,'정지 롱프레스',async()=>{clickUI('#pause');const x=q.run.active.x,pausedStep=tutorialStep();tap(-1);await wait(220);assert(q.run.active.x===x&&tutorialStep()===pausedStep,'일시정지 중 튜토리얼 입력');clickUI('[data-menu="resume"]');const p=point(-1);pointer('pointerdown',p);await wait(260);pointer('pointerup',p);});
 await perform(3,'CW 스와이프',async()=>swipe(70,0));
 await perform(4,'위 스와이프 HOLD',async()=>swipe(0,-70));
 await perform(5,'아래 스와이프 DROP',async()=>swipe(0,70));
 await perform(6,'실제 쏙 버튼',async()=>{const b=w.document.querySelector('[data-action="drop"]'),r=b.getBoundingClientRect();emit(b,'pointerdown',r.x+r.width/2,r.y+r.height/2,702);emit(b,'pointerup',r.x+r.width/2,r.y+r.height/2,702);});
 await perform(7,'직접 한 줄 완성',async()=>{tap(1);swipe(0,70);});
 await waitFor(()=>tutorialStep()===9,'콤보 예시 종료',7000);steps.push({step:9,name:'실제 콤보 자산 예시',result:'PASS'});
 const completedBeforeClick=JSON.parse(w.localStorage.getItem(key)||'{}');assert(completedBeforeClick.tutorialCompleted!==true,'완료 버튼 전 완료 저장');assert(JSON.stringify(completedBeforeClick.endlessV1)===JSON.stringify(before.endlessV1),'튜토리얼 점수가 최고점을 변경');assert(w.localStorage.getItem('glassfall-adaptive-v1')===adaptiveBefore,'튜토리얼이 Adaptive 저장 변경');
 clickUI('.bloom-tutorial-start');await waitFor(()=>!q.training&&q.state==='playing','튜토리얼 후 새 게임');assert(q.run.score===0&&q.run.lines===0&&!q.drag,'새 게임에 튜토리얼 상태가 남음');
 const after=JSON.parse(w.localStorage.getItem(key));assert(after.tutorialCompleted===true,'완료 저장 없음');for(const key of ['sound','bgm','sfx','haptics','effects','qaPreservedField'])assert(after[key]===before[key],'설정 변형: '+key);steps.push({step:10,name:'완료 → 깨끗한 정상 게임',result:'PASS'});
 q.pause();clickUI('[data-menu="settings"]');clickUI('[data-menu="tutorial"]');await waitFor(()=>q.training&&tutorialStep()===0,'설정에서 다시 보기');clickUI('.bloom-tutorial-skip');await waitFor(()=>!q.training&&q.state==='playing','SKIP 후 새 게임');assert(JSON.parse(w.localStorage.getItem('glassfall-v1')).tutorialCompleted===true,'SKIP 저장 정책');assert(q.run.score===0&&!q.drag,'SKIP 후 이전 상태');
 q.menu();const warm=performance.now();clickUI('[data-menu="start"]');await waitFor(()=>q.state==='playing'&&!q.training,'완료 사용자 바로 게임');
 return{firstInstallation:fresh?{...firstInstallBoot,strictEmptyBoot:true,testBest:0}:false,firstLoading,warmLoading:{actualTransitionMs:rounded(performance.now()-warm),...q.loading.stats().last},steps,wrongInput:'PASS',pauseResume:'PASS',skip:'PASS',replay:'PASS',existingBestSettingsAdaptive:'PASS',snapshot:snapshot()};
}
function bounds(el){const r=el.getBoundingClientRect();return{x:rounded(r.x),y:rounded(r.y),width:rounded(r.width),height:rounded(r.height),right:rounded(r.right),bottom:rounded(r.bottom)};}
function visible(el){if(!el||el.closest('[hidden]')||!el.getClientRects().length)return false;for(let node=el;node;node=node.parentElement){const css=w.getComputedStyle(node);if(css.display==='none'||css.visibility==='hidden'||Number(css.opacity)===0)return false;}return true;}
async function settleHome(){
 const home=w.document.querySelector('.cb-home'),started=performance.now();assert(home,'홈 화면 없음');
 // Keep the tested iframe on screen. Offscreen CSS timelines are not mobile evidence.
 frame.scrollIntoView({block:'start',behavior:'instant'});home.getBoundingClientRect();
 for(const el of home.querySelectorAll('*'))w.getComputedStyle(el).opacity;
 const animations=home.getAnimations({subtree:true});
 const complete=await Promise.race([Promise.all(animations.map(a=>a.finished.catch(()=>null))).then(()=>true),wait(2000).then(()=>false)]);
 const paint=await Promise.race([new Promise(resolve=>w.requestAnimationFrame(()=>resolve(true))),wait(1000).then(()=>false)]);
 return{complete:complete&&paint,elapsedMs:rounded(performance.now()-started),animations:animations.map(a=>({state:a.playState,pending:a.pending,currentTime:rounded(a.currentTime)}))};
}
function geometryScreen(screen){
 const doc=w.document,width=doc.documentElement.clientWidth,height=doc.documentElement.clientHeight;
 const selectors={HOME:['.cb-start','.cb-settings','.cb-logo','.cb-hero','.cb-tagline'],LOADING:['.cb-load-logo','.cb-load-friends','.cb-load-status','.cb-load-tip'],GAME:['#board','#pause','#hold','#drop','[data-preview="0"]','[data-preview="1"]'],TUTORIAL:['#board','#pause','#hold','#drop','.bloom-tutorial-note','.bloom-tutorial-skip'],OVER:['#panel h2','.result-score','#panel [data-menu="new"]','#panel [data-menu="retry"]','#panel [data-menu="menu"]']}[screen];
 const rows=selectors.map(selector=>{const el=doc.querySelector(selector);if(!el||!visible(el))return{selector,visible:false,result:'FAIL',reason:'필수 화면 요소가 보이지 않음'};
  const r=el.getBoundingClientRect(),inside=r.left>=-1.5&&r.top>=-1.5&&r.right<=width+1.5&&r.bottom<=height+1.5,isImage=el.tagName==='IMG',interactive=el.matches('button,a,input,select'),clippers=[];
  for(let parent=el.parentElement;parent&&parent!==doc.body;parent=parent.parentElement){const css=w.getComputedStyle(parent),pr=parent.getBoundingClientRect();if(/hidden|clip|auto|scroll/.test(css.overflowX)&& (r.left<pr.left-1.5||r.right>pr.right+1.5))clippers.push(parent.id||parent.className);if(/hidden|clip|auto|scroll/.test(css.overflowY)&& (r.top<pr.top-1.5||r.bottom>pr.bottom+1.5))clippers.push(parent.id||parent.className);}
  const hit=interactive?doc.elementFromPoint(r.left+r.width/2,r.top+r.height/2):null,hitOK=!interactive||!!hit&&(hit===el||el.contains(hit));const loaded=!isImage||el.complete&&el.naturalWidth>0;
  return{selector,visible:true,bounds:bounds(el),insideViewport:inside,clippedBy:[...new Set(clippers)],interactive,centerReceivesPointer:hitOK,smallTouchTarget:interactive&&(r.width<44||r.height<44),textOverflowX:!isImage&&el.scrollWidth>el.clientWidth+2,image:isImage?{complete:el.complete,naturalWidth:el.naturalWidth,naturalHeight:el.naturalHeight}:undefined,result:!loaded||!hitOK||(!isImage&&(!inside||clippers.length))?'FAIL':isImage&&(!inside||clippers.length)?'VISUAL REVIEW':'PASS'};
 });
 return{screen,actualViewport:{width,height},iframeCSS:{width:frame.clientWidth,height:frame.clientHeight},documentWidth:doc.documentElement.scrollWidth,panelScroll:doc.getElementById('panel')?{height:doc.getElementById('panel').clientHeight,scrollHeight:doc.getElementById('panel').scrollHeight}:null,rows,result:rows.some(r=>r.result==='FAIL')?'FAIL':rows.some(r=>r.result==='VISUAL REVIEW')?'VISUAL REVIEW':'PASS'};
}
function slowPreload(){assert(q.celebration&&q.loading,'실제 로딩 모듈 없음');const original=q.celebration.preload;let restored=false;q.celebration.preload=()=>Promise.all([Promise.resolve(original()),wait(1000)]).then(([result])=>result);return()=>{if(!restored){restored=true;q.celebration.preload=original;}};}
async function loadingPreview(){
 q.menu();let restore=slowPreload(),request=q.requestStart();try{await wait(70);assert(q.state==='loading'&&q.loading.stats().active,'실제 로딩 상태 없음');const loadingGeometry=geometryScreen('LOADING');write({test:'실제 로딩 화면',state:'LOADING',geometry:loadingGeometry,snapshot:snapshot()});setStatus('실제 자산 준비를 1000ms 지연한 로딩 화면');await request;assert(q.loading.stats().last.elapsed>=950&&q.loading.stats().last.elapsed<1500,'로딩 상한/준비 지연 오류');const completed={...q.loading.stats()};restore();q.menu();
  restore=slowPreload();request=q.requestStart();await wait(70);q.menu();await request;await wait(1100);assert(q.state==='menu'&&!q.loading.stats().active,'취소된 로딩이 늦게 게임을 시작함');return{result:loadingGeometry.result,actualDelayedLoading:completed,cancelledLoading:q.loading.stats(),loadingGeometry,snapshot:snapshot()};
 }finally{restore();}
}
async function mobileGeometry(){
 const reports=[];for(const [width,height]of[[360,640],[390,844],[412,915]]){alive();frame.style.width=width+'px';frame.style.height=height+'px';frame.title=`RC 검수 게임 ${width} × ${height}`;document.getElementById('viewport').value=width+','+height;await wait(100);
  q.menu();const entrance=await settleHome(),home=geometryScreen('HOME');home.entrance=entrance;if(!entrance.complete)home.result='NOT VERIFIED';reports.push(home);
  const restore=slowPreload();try{const request=q.requestStart();await wait(100);assert(q.state==='loading','로딩 화면 측정 전 종료됨');reports.push(geometryScreen('LOADING'));await request;}finally{restore();}
  prepare();await wait(100);reports.push(geometryScreen('GAME'));
  q.start(false,true);await wait(100);reports.push(geometryScreen('TUTORIAL'));
  prepare();q.finish('qa_geometry');await wait(100);reports.push(geometryScreen('OVER'));
  setStatus(`${width} × ${height} 5화면 측정 완료`);
 }
 const failed=reports.filter(r=>r.result==='FAIL'),pending=reports.filter(r=>r.result==='NOT VERIFIED'),review=reports.filter(r=>r.result==='VISUAL REVIEW');return{result:failed.length?'FAIL':pending.length?'NOT VERIFIED':review.length?'VISUAL REVIEW':'PASS',scope:'실제 화면 DOM 경계/중앙 포인터 대상 측정; 이미지 투명 여백은 별도 시각 검수',screens:reports.length,failed:failed.length,notVerified:pending.length,imageReview:review.length,reports,snapshot:snapshot()};
}
async function soundOn(){q.pause();w.document.querySelector('[data-menu="settings"]')?.click();for(const [key,flag]of[['sound','sound'],['bgm','bgm'],['sfx','sfx']]){const stat=w.BloomAudio?.stats?.();if(stat&&stat[flag]===false)w.document.querySelector(`[data-menu="${key}"]`)?.click();}w.document.querySelector('[data-menu="back"]')?.click();q.resume();await w.BloomAudio?.unlock?.();}
function stopSoak(reason){if(soakTimer)clearTimeout(soakTimer);soakTimer=null;if(!soakData)return;q.pause();soakData.stopped=reason;soakData.actualElapsedMs=rounded(performance.now()-soakData.start);soakData.final=snapshot();soakOut.textContent=JSON.stringify(soakData,null,2);controls(false);setStatus('실시간 검사 '+reason+' — 샘플의 실제 경과 시간을 확인하세요');}
async function startSoak(){if(busy)return;controls(true);stopRequested=false;prepare();await soundOn();Object.assign(monitor,{frames:0,frameSum:0,maxFrame:0,over50:0,frameRing:[],hiddenSamples:0,longTasks:0,maxLongTask:0,maxTimers:monitor.timers.size});const started=performance.now();soakData={kind:'real-wallclock-browser-soak',start:started,startedISO:new Date().toISOString(),targetMinutes:30,input:'synthetic actions; no physical Android input',storage:'isolated memory',samples:[{minute:0,snapshot:snapshot()}],cycles:0,drops:0,nextSample:10};let tick=0;
 const loop=()=>{try{if(stopRequested){stopSoak('사용자 중지');return;}const age=performance.now()-started,minutes=age/60000;
  if(q.state==='over'||q.state==='menu'){prepare();soakData.cycles++;}
  if(tick>0&&tick%15===0){const kinds=['oasis','spear','sunburst','mummy','scarabCurse','seal'];q.itemScenario(kinds[Math.floor(tick/15)%kinds.length]);q.resume();q.action('drop');soakData.forcedItemScenarios=(soakData.forcedItemScenarios||0)+1;}
  if(q.state==='playing'){const p=point(tick%2?1:-1);pointer('pointerdown',p);pointer('pointerup',p);q.action(tick%3===0?'rotate':'hold');q.action('drop');soakData.drops++;}
  if(tick%7===0){q.celebration?.celebrate({combo:2+tick%6,lines:tick%21===0?4:1});w.BloomAudio?.effect('combo',2+tick%5);}
  if(tick>0&&tick%60===0){q.pause();q.resume();q.menu();prepare();soakData.cycles++;}
  if(minutes>=soakData.nextSample){soakData.samples.push({minute:soakData.nextSample,actualElapsedMs:rounded(age),snapshot:snapshot()});soakData.nextSample+=10;}
  soakData.actualElapsedMs=rounded(age);soakData.current=snapshot();soakOut.textContent=JSON.stringify(soakData,null,2);setStatus(`실시간 검사 ${minutes.toFixed(2)} / 30분 · ${soakData.drops} DROP`);tick++;
  if(minutes>=30){stopSoak('30분 완료');return;}soakTimer=setTimeout(loop,1000);
 }catch(e){soakData.error=String(e);stopSoak('오류');}};loop();}
frame.addEventListener('load',()=>{try{monitor?.stop();w=frame.contentWindow;q=w.__GLASSFALL_QA__;assert(q,'qa=1 API가 없습니다');firstInstallBoot=null;if(w.document.querySelector('meta[name="rc-first-install"]')){const boot=w.__BLOOM_FIRST_INSTALL_QA__?.stats();assert(boot,'신규 설치 shim 없음');firstInstallBoot={...boot,homeBest:Number((w.document.querySelector('.cb-best strong')?.textContent||'').replace(/[^0-9]/g,'')),tutorialCompleted:JSON.parse(w.localStorage.getItem('glassfall-v1')||'{}').tutorialCompleted===true,state:q.state};}else sandboxStorage(w);monitor=instrument(w);ready=true;controls(false);setStatus(firstInstallBoot?'완전 신규 사용자 준비 · 앱 부팅 전 빈 메모리 저장':'준비됨 · 저장은 메모리 사본으로 격리');write(snapshot());}catch(e){ready=false;write({result:'FAIL',error:String(e)});setStatus('검수 페이지 준비 실패');}});
document.getElementById('viewport').onchange=e=>{const [width,height]=e.target.value.split(',').map(Number);frame.style.width=width+'px';frame.style.height=height+'px';frame.title=`RC 검수 게임 ${width} × ${height}`;};

document.getElementById('home').onclick=()=>{q.menu();write(snapshot());};document.getElementById('game').onclick=()=>{prepare();write(snapshot());};document.getElementById('over').onclick=()=>{prepare();q.finish('qa_screen');write(snapshot());};document.getElementById('snapshot').onclick=()=>write(snapshot());
document.getElementById('loading-screen').onclick=()=>runTask('실제 로딩 화면·취소',loadingPreview);document.getElementById('geometry').onclick=()=>runTask('모바일 화면 영역',mobileGeometry);
document.getElementById('tutorial-flow').onclick=()=>runTask('첫 사용자·튜토리얼 전체 검사',tutorialFlow);document.getElementById('tutorial-screen').onclick=()=>{q.start(false,true);write(snapshot());};
