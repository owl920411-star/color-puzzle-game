<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Flower Bloom</title><style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Georgia,"Noto Serif KR",serif;color:#fff;overflow:hidden;background:radial-gradient(circle at 50% 9%,#ef9ea8 0 8%,transparent 25%),linear-gradient(#5d6685 0 19%,#d67d87 19% 34%,#6d6f69 34% 100%)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 8%,#ffb6c1 0 2px,transparent 3px),radial-gradient(circle at 90% 14%,#ffd1d8 0 3px,transparent 4px),radial-gradient(circle at 16% 82%,#f6a4b6 0 4px,transparent 5px);background-size:54px 62px,76px 84px,92px 110px;opacity:.5}.app{max-width:430px;height:100vh;margin:auto;padding:7px 9px 10px;display:flex;flex-direction:column;gap:6px;position:relative;background:linear-gradient(#0000 0 24%,#4a262e55 38%,#191416aa 100%)}.app:before{content:"Flower\A Bloom";white-space:pre;position:absolute;top:7px;left:17px;font-style:italic;font-weight:900;font-size:31px;line-height:.75;color:#ffe4a8;text-shadow:0 2px 0 #5a3428,0 0 12px #ffcf8a;z-index:1}.app:after{content:"🌸  꽃이 피는 정원";position:absolute;top:65px;left:20px;font-size:11px;color:#ffe7df;letter-spacing:1px}.hud,.mission,.legend{background:linear-gradient(180deg,#493c3de8,#2b2325f2);border:2px solid #d6a36d;box-shadow:inset 0 0 0 2px #6f4b3d,0 3px 7px #0008;border-radius:16px}.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:92px}.stat{min-width:72px;text-align:center;font-weight:800}.small{font-size:10px;color:#e7cdb8;letter-spacing:.6px}.big{font-size:21px;color:#fff4dd;text-shadow:0 1px #000}.timer{height:12px;flex:1;background:#1e1919;border:1px solid #d5ad78;border-radius:8px;overflow:hidden}.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f1b267,#f48787,#d83c66);box-shadow:0 0 8px #ff9b85}.beat{position:absolute;top:106px;right:18px;width:11px;height:11px;background:#9a725f;border-radius:50%;z-index:3}.beat.on{background:#ffd28d;box-shadow:0 0 14px #fff;transform:scale(1.7)}.mission{display:flex;justify-content:space-between;align-items:center;padding:8px 11px}.mission b{font-size:13px;color:#fff1e4}.progress{font-size:16px;font-weight:900;color:#ffdcb0}.legend{display:flex;justify-content:center;gap:10px;padding:5px;font-size:11px;font-weight:800;color:#ffe8d2}.grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:4px;padding:7px;background:linear-gradient(145deg,#3b2a2b,#1e191b);border:6px solid #5b3b32;outline:2px solid #d4a16c;border-radius:18px;box-shadow:inset 0 0 18px #000,0 7px 14px #0009;min-height:0}.cell{touch-action:none;display:grid;place-items:center;border-radius:8px;background:linear-gradient(145deg,#403637,#211d1e);border:1px solid #79564c;box-shadow:inset 0 0 7px #0009;position:relative}.bud{width:76%;height:82%;background-image:url('assets/bud.webp')!important;background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;border-radius:55% 55% 48% 48%;box-shadow:inset 7px 4px 10px #ffffff66,inset -6px -7px 9px #0004,0 4px 5px #0008,0 0 5px #fff3;position:relative;transform:rotate(0deg)}.bud:before{display:none;content:"";position:absolute;left:45%;top:5%;width:13%;height:76%;border-radius:50%;background:#ffffff26;transform:rotate(-18deg)}.bud:after{display:none;content:"";position:absolute;left:7%;right:7%;bottom:-12%;height:31%;background:#4d9a49;filter:drop-shadow(0 2px 1px #173d1b);clip-path:polygon(0 100%,18% 15%,45% 67%,50% 0,58% 67%,86% 12%,100% 100%)}.flower{background-image:none!important;filter:none!important;border-radius:50% 12% 50% 12%;box-shadow:12px 12px 0 currentColor,-12px -12px 0 currentColor,12px -12px 0 currentColor,-12px 12px 0 currentColor,0 0 25px #fff0a8}.flower:after{content:"";left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#ffe36d}.pop{animation:pop .38s}.drop{animation:drop .22s}.shake{animation:shake .25s}@keyframes pop{50%{transform:scale(1.25)}}@keyframes drop{from{transform:translateY(-25px);opacity:0}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.harvest{height:26px;display:flex;gap:4px;overflow:hidden;background:#211b1cdd;border:2px solid #b98055;border-radius:10px;padding:4px}.dot{width:14px;height:14px;border-radius:50%;flex:none}.overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,#ef9ea9ee,#39282df5 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:15}.overlay h1{margin:4px;color:#ffe0a2;text-shadow:0 2px #5b3028}.overlay p{line-height:1.6;color:#fff1e7}.btn{border:2px solid #e1b070;border-radius:15px;background:linear-gradient(#7b4e3d,#432d2a);box-shadow:0 4px #231a19;padding:12px 28px;font-weight:900;font-size:16px;color:#fff0d5}.hide{display:none}.float{position:absolute;z-index:9;font-weight:900;pointer-events:none;animation:up .6s forwards;color:#fff4c9;text-shadow:0 2px #7a2941}.comboFx{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;font-weight:1000;text-shadow:0 3px 0 #6c3041,0 0 22px #ffb6dc;font-size:34px;color:#ffe0a0;animation:comboBurst .55s forwards}.comboFx.hot{font-size:44px}.comboFx.mega{font-size:54px}.cell.comboGlow{animation:glow .42s}.devPanel{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;background:#2c2324f5;border:2px solid #d3a26d;border-radius:16px;padding:10px;box-shadow:0 5px 16px #0008;font-size:12px}.devHead{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:7px}.devRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.devBtn{border:1px solid #b9875c;border-radius:9px;background:#59413a;color:#fff;padding:7px 9px;font-weight:800}.devInfo{margin-top:6px;line-height:1.45}.stageClear{position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;background:#4b2734cc;color:#ffe0a3;font-size:34px;font-weight:1000;text-align:center;text-shadow:0 3px #6b2d3e;animation:clearBurst .85s forwards}@keyframes clearBurst{0%{opacity:0;transform:scale(.7)}25%{opacity:1;transform:scale(1.08)}75%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes up{to{transform:translateY(-35px);opacity:0}}@keyframes comboBurst{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.18);opacity:1}100%{transform:scale(.9) translateY(-30px);opacity:0}}@keyframes glow{50%{filter:brightness(1.7);box-shadow:0 0 25px #ff9bd0}}@media(max-height:760px){.hud{margin-top:70px}.app:before{font-size:26px}.app:after{top:51px}.legend{display:none}}
</style></head><body><div class="app" id="app"><div class="hud"><div class="stat"><div class="small">SCORE</div><div class="big" id="score">0</div><div class="small" id="combo">COMBO 0</div></div><div class="timer"><i id="bar"></i></div><div class="stat"><div class="small">TIME</div><div class="big" id="time">60</div></div></div><div class="beat" id="beat"></div><div class="mission" id="mission"><div><div class="small" id="stage">STAGE 1</div><b id="target">🎯 목표 꽃</b></div><div class="progress" id="progress"></div></div><div class="legend">🔴+🔵=🟣　🔴+🟡=🟠　🔵+🟡=🟢</div><div class="grid" id="grid"></div><div class="harvest" id="harvest"></div><div style="text-align:center;font-size:9px;letter-spacing:3px;color:#e8c7ae">FLOWER BLOOM · A BRIGHTER TOMORROW</div>
<div class="overlay" id="start"><div class="small" id="sStage"></div><h1>🌸 오늘의 개화 목표</h1><div class="big" id="sGoal"></div><p id="guide"></p><button class="btn" id="startBtn">시작하기</button><p class="small">↔ 탭 없이 스와이프로만 플레이</p></div>
<div class="overlay hide" id="end"><h1 id="endTitle"></h1><p id="result"></p><button class="btn" id="next">다음 스테이지</button><button class="btn" id="retry" style="margin-top:12px;background:#fff">다시 하기</button></div><div class="devPanel hide" id="devPanel"><div class="devHead"><span>🛠️ 개발자 모드</span><button class="devBtn" id="devClose">닫기</button></div><div class="devRow"><button class="devBtn" id="devPrev">◀ 이전 ST</button><button class="devBtn" id="devNext">다음 ST ▶</button><button class="devBtn" id="devComplete">목표 직전</button></div><div class="devRow"><button class="devBtn" id="devTimePlus">시간 +10초</button><button class="devBtn" id="devTimeMinus">시간 -10초</button><button class="devBtn" id="devPause">타이머 정지</button></div><div class="devRow"><button class="devBtn" id="devGoalPlus">목표 +1</button><button class="devBtn" id="devGoalMinus">목표 -1</button><button class="devBtn" id="devReset">현재 ST 리셋</button></div><div class="devInfo" id="devInfo"></div></div></div>
<script>
const C={red:'var(--r)',blue:'var(--b)',yellow:'var(--y)'},P=['red','blue','yellow'],F={purple:{e:'🟣',n:'보라꽃',c:'var(--p)',need:['red','blue'],r:'🔴+🔵'},orange:{e:'🟠',n:'주황꽃',c:'var(--o)',need:['red','yellow'],r:'🔴+🟡'},green:{e:'🟢',n:'초록꽃',c:'var(--g)',need:['blue','yellow'],r:'🔵+🟡'}},M={'blue,red':'purple','red,yellow':'orange','blue,yellow':'green'};
const ST=[{g:{purple:8},t:60,a:.28},{g:{orange:10},t:60,a:.25},{g:{green:12},t:60,a:.23},{g:{purple:8,green:6},t:55,a:.20},{g:{purple:7,orange:7,green:7},t:55,a:.16}],N=6;
let si=0,T=ST[0],board=[],goals={},score=0,time=60,combo=0,maxCombo=0,total=0,run=false,beatAt=0,timer,beatTimer,startIdx=null,sx=0,sy=0,busy=new Set(),lastFlower=null,clearing=false,devPaused=false,stageHoldTimer=null;
const $=x=>document.getElementById(x),budStyle=(el,k)=>{el.style.background='transparent';el.style.filter=k==='red'?'none':k==='blue'?'hue-rotate(205deg) saturate(1.25) brightness(1.08)':k==='yellow'?'hue-rotate(55deg) saturate(1.45) brightness(1.18)':'none'}, entries=()=>Object.entries(T.g), done=()=>entries().every(([n,g])=>(goals[n]||0)>=g);
function goalText(){return entries().map(([n,g])=>F[n].e+' '+Math.min(goals[n]||0,g)+'/'+g).join('  ')}
function ui(){T=ST[si];$('stage').textContent=$('sStage').textContent='STAGE '+(si+1);$('target').textContent=entries().length>1?'🎯 여러 목표를 완성하세요':'🎯 목표 꽃을 피우세요';$('progress').textContent=goalText();$('sGoal').innerHTML=entries().map(([n,g])=>F[n].e+' '+F[n].n+' <b>'+g+'송이</b>').join('　');$('guide').innerHTML=[...new Set(entries().map(([n])=>F[n].r))].join(' / ')+'<br>⏱️ 제한시간 <b>'+T.t+'초</b><br><small>같은 꽃 2연속부터 콤보 · 매회 +0.2초</small>';if(done()){$('progress').textContent='✓ '+goalText();$('mission').animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:400})}}
function counts(){let c={red:0,blue:0,yellow:0};board.forEach(x=>x&&c[x.k]!=null&&c[x.k]++);return c}function devInfo(){if(!$('devInfo'))return;let c=counts();$('devInfo').textContent='ST '+(si+1)+' / '+ST.length+' · 목표 '+entries().map(([n,g])=>F[n].e+g).join(' ')+' · 보드 🔴'+c.red+' 🔵'+c.blue+' 🟡'+c.yellow+' · 남은시간 '+time.toFixed(1)+'초'}
function spawn(){if(Math.random()>.30)return P[Math.random()*3|0];let c=counts(),w={red:1,blue:1,yellow:1};entries().forEach(([f,g])=>{if((goals[f]||0)>=g)return;F[f].need.forEach(k=>w[k]+=Math.max(0,10-c[k])*.2+T.a*3)});let r=Math.random()*(w.red+w.blue+w.yellow);for(let k of P){r-=w[k];if(r<=0)return k}return'yellow'}
function build(){board=[];busy.clear();$('grid').innerHTML='';for(let i=0;i<36;i++){let k=P[Math.random()*3|0],el=document.createElement('div'),bud=document.createElement('div');el.className='cell';bud.className='bud';budStyle(bud,k);el.append(bud);$('grid').append(el);board.push({k,el,bud});el.addEventListener('touchstart',e=>{if(!run||busy.has(i))return;let t=e.touches[0];startIdx=i;sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',e=>{if(startIdx==null||!run)return;let a=startIdx,t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,row=a/N,col=a%N,b=null;startIdx=null;if(Math.max(Math.abs(dx),Math.abs(dy))>=18){if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&col<5)b=a+1;if(dx<0&&col>0)b=a-1}else{if(dy>0&&row<5)b=a+6;if(dy<0&&row>0)b=a-6}}b!=null&&!busy.has(b)?merge(a,b):fail(a,a)},{passive:true})}}
function fail(a,b){combo=0;lastFlower=null;$('combo').textContent='COMBO 0';[a,b].forEach(i=>{if(!board[i])return;board[i].el.classList.add('shake');setTimeout(()=>board[i].el.classList.remove('shake'),260)})}
function floater(el,txt){let r=el.getBoundingClientRect(),q=$('app').getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=r.left-q.left+10+'px';f.style.top=r.top-q.top+'px';$('app').append(f);setTimeout(()=>f.remove(),620)}
function merge(a,b){if(busy.has(a)||busy.has(b))return;let x=board[a].k,y=board[b].k,key=[x,y].sort().join(','),name=M[key];if(!name){fail(a,b);return}busy.add(a);busy.add(b);combo=(lastFlower===name)?combo+1:1;lastFlower=name;maxCombo=Math.max(maxCombo,combo);$('combo').textContent=(combo>=2?'🔥 ':'')+'COMBO '+combo;let target=T.g[name]!=null&&(goals[name]||0)<T.g[name],perfect=Date.now()-beatAt<260,mul=1+Math.min(combo-1,9)*.1,pts=Math.round((target?100:45)*(perfect?2:1)*mul/5)*5;score+=pts;total++;goals[name]=(goals[name]||0)+1;$('score').textContent=score;ui();let justCleared=done();if(combo>=2){time=Math.min(T.t+8,time+.2);let fx=document.createElement('div');fx.className='comboFx'+(combo>=8?' mega':combo>=5?' hot':'');fx.textContent=(combo>=8?'🌺 ':combo>=5?'✨ ':'🔥 ')+combo+' COMBO  +0.2s';$('app').append(fx);board[b].el.classList.add('comboGlow');setTimeout(()=>{fx.remove();board[b].el.classList.remove('comboGlow')},560)}floater(board[b].el,(perfect?'PERFECT! ':'')+(combo>=2?'🔥'+combo+' ':'')+(target?'🎯 ':'🌸 ')+'+'+pts);let d=document.createElement('i');d.className='dot';d.style.background=F[name].c;$('harvest').append(d);[a,b].forEach(i=>{board[i].k=null;board[i].bud.style.transform='scale(0)'});board[b].bud.style.transform='';board[b].bud.style.background=F[name].c;board[b].bud.style.color=F[name].c;board[b].bud.classList.add('flower');board[b].el.classList.add('pop');setTimeout(()=>[a,b].forEach(i=>{let k=spawn();board[i].k=k;board[i].bud.className='bud';board[i].bud.removeAttribute('style');budStyle(board[i].bud,k);board[i].el.classList.remove('pop');board[i].el.classList.add('drop');setTimeout(()=>board[i].el.classList.remove('drop'),230);busy.delete(i)}),380);if(justCleared)stageClear()}
function begin(){goals={purple:0,orange:0,green:0};score=combo=maxCombo=total=0;lastFlower=null;clearing=false;devPaused=false;time=T.t;$('score').textContent='0';$('combo').textContent='COMBO 0';$('time').textContent=T.t;$('bar').style.width='100%';$('harvest').innerHTML='';build();ui();$('start').classList.add('hide');$('end').classList.add('hide');run=true;beatAt=Date.now();clearInterval(beatTimer);beatTimer=setInterval(()=>{beatAt=Date.now();$('beat').classList.add('on');setTimeout(()=>$('beat').classList.remove('on'),160)},900);clearInterval(timer);timer=setInterval(()=>{if(devPaused)return;time=Math.max(0,time-.1);$('time').textContent=Math.ceil(time);$('bar').style.width=Math.min(100,time/T.t*100)+'%';devInfo();if(time<=0)finish()},100)}
function stageClear(){if(clearing||!run)return;clearing=true;run=false;clearInterval(timer);clearInterval(beatTimer);let fx=document.createElement('div');fx.className='stageClear';fx.innerHTML='🌸 STAGE '+(si+1)+' CLEAR!<br><small>다음 스테이지로 이동</small>';$('app').append(fx);setTimeout(()=>{fx.remove();si=si<ST.length-1?si+1:0;T=ST[si];goals={purple:0,orange:0,green:0};score=combo=maxCombo=total=0;lastFlower=null;time=T.t;ui();build();$('score').textContent='0';$('combo').textContent='COMBO 0';$('time').textContent=T.t;$('bar').style.width='100%';$('harvest').innerHTML='';$('start').classList.remove('hide');clearing=false;devInfo()},850)}function finish(){if(!run)return;run=false;clearInterval(timer);clearInterval(beatTimer);$('endTitle').textContent=done()?'🌸 STAGE CLEAR!':'조금만 더 피워볼까요?';$('result').textContent='최종 점수 '+score+' · '+goalText()+' · 전체 개화 '+total+'송이 · MAX COMBO '+maxCombo;$('next').style.display=done()?'block':'none';$('next').textContent=done()&&si===ST.length-1?'처음부터 다시':'다음 스테이지';$('end').classList.remove('hide')}
$('startBtn').onclick=begin;$('retry').onclick=begin;$('next').onclick=()=>{si=si<ST.length-1?si+1:0;T=ST[si];goals={purple:0,orange:0,green:0};ui();$('end').classList.add('hide');$('start').classList.remove('hide')};function jumpStage(d){run=false;clearInterval(timer);clearInterval(beatTimer);si=(si+d+ST.length)%ST.length;T=ST[si];goals={purple:0,orange:0,green:0};time=T.t;ui();build();$('time').textContent=T.t;$('bar').style.width='100%';$('end').classList.add('hide');$('start').classList.remove('hide');devInfo()}function toggleDev(show){$('devPanel').classList.toggle('hide',show===false?true:show===true?false:!$('devPanel').classList.contains('hide'));devInfo()}$('stage').addEventListener('touchstart',()=>{clearTimeout(stageHoldTimer);stageHoldTimer=setTimeout(()=>toggleDev(),900)},{passive:true});$('stage').addEventListener('touchend',()=>clearTimeout(stageHoldTimer),{passive:true});$('stage').addEventListener('mousedown',()=>{clearTimeout(stageHoldTimer);stageHoldTimer=setTimeout(()=>toggleDev(),900)});$('stage').addEventListener('mouseup',()=>clearTimeout(stageHoldTimer));$('devClose').onclick=()=>toggleDev(false);$('devPrev').onclick=()=>jumpStage(-1);$('devNext').onclick=()=>jumpStage(1);$('devComplete').onclick=()=>{entries().forEach(([n,g])=>goals[n]=Math.max(0,g-1));ui();devInfo()};$('devTimePlus').onclick=()=>{time+=10;$('time').textContent=Math.ceil(time);devInfo()};$('devTimeMinus').onclick=()=>{time=Math.max(.1,time-10);$('time').textContent=Math.ceil(time);devInfo()};$('devPause').onclick=()=>{devPaused=!devPaused;$('devPause').textContent=devPaused?'타이머 재개':'타이머 정지';devInfo()};$('devGoalPlus').onclick=()=>{Object.keys(T.g).forEach(n=>T.g[n]++);ui();devInfo()};$('devGoalMinus').onclick=()=>{Object.keys(T.g).forEach(n=>T.g[n]=Math.max(1,T.g[n]-1));ui();devInfo()};$('devReset').onclick=()=>{toggleDev(false);begin()};goals={purple:0,orange:0,green:0};ui();build();devInfo();
</script></body></html>
