<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1928"><meta name="description" content="일반 모드와 모래 모드로 즐기는 무한 점수 퍼즐">
<title>GLASSFALL · 무한 점수제</title>
<link rel="stylesheet" href="endless.css?v=12e494839ae1">
</head>
<body>
<main id="app">
 <header class="topbar"><div><strong>GLASSFALL</strong><span id="mode-label">일반 · 무한 모드</span></div><button id="pause" aria-label="일시정지" disabled>Ⅱ</button></header>
 <section class="scorebar" aria-label="게임 기록">
  <div class="current-score"><span>SCORE</span><strong id="score">0</strong></div>
  <div><span>BEST</span><strong id="best">0</strong></div>
  <div><span id="pace-label">LEVEL 1</span><strong id="time">0:00</strong></div>
 </section>
 <section id="game-area" aria-label="게임판과 조작">
  <aside class="rail" aria-label="다음 블록과 조작 버튼">
   <button class="preview-card" data-preview="0" aria-label="다음 블록 확대"><span>다음 1</span><canvas id="next" width="120" height="100"></canvas></button>
   <button class="preview-card" data-preview="1" aria-label="두 번째 다음 블록 확대"><span>다음 2</span><canvas id="next2" width="120" height="100"></canvas></button>
   <div class="rail-space"></div>
   <button id="hold" class="hold-card" data-action="hold" aria-label="블록 보관"><span>보관</span><canvas id="held" width="120" height="80"></canvas></button>
   <button id="rotate" class="rotate-card" data-action="rotate" aria-label="블록 회전"><b aria-hidden="true">↻</b><span>회전</span></button>
   <button id="drop" class="drop-card" data-action="drop" aria-label="즉시 하강"><b aria-hidden="true">⇓</b><span>즉시 하강</span></button>
  </aside>
  <div class="board-shell"><canvas id="board" width="360" height="720" aria-label="좌우로 밀어 이동하고 아래로 빠르게 밀어 하강하는 게임판" role="application"></canvas><div id="callout" role="status" aria-live="polite"></div></div>
 </section>
 <footer><span id="notice">좌우 스와이프 · 회전 · 즉시 하강</span><small id="build">ENDLESS 1 · SHATTER FX</small></footer>
</main>
<div id="overlay" role="dialog" aria-modal="true" aria-label="게임 메뉴"><div id="panel" tabindex="-1"></div></div>
<p id="boot" role="status">게임을 불러오고 있습니다.</p>
<noscript>이 게임을 실행하려면 JavaScript를 켜 주세요.</noscript>
<script src="engine.js?v=9556069dfd3b"></script>
<script src="sand-micro.js?v=e40947f87561"></script>
<script src="art.js?v=f04ed8510595"></script>
<script src="endless-rules.js?v=67689b2567c2"></script>
<script src="glass-shatter-fx.js?v=shatter1"></script>
<script src="endless-app.js?v=shatter1"></script>
</body>
</html>
