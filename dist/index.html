<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e8"><meta name="description" content="파스텔 크레용 손그림 세계에서 즐기는 귀여운 무한 블록 퍼즐">
<meta name="crayon-build" content="CB-RC2-STORYBOOK-SEQUENCE1">
<title>크레용블룸 · CRAYON BLOOM</title>

<link rel="stylesheet" href="bloom-home.css?v=cb-rc2-storybook-sequence1">
<link rel="stylesheet" href="storybook.css?v=cb-rc2-storybook-sequence1">
<link rel="preload" as="image" href="assets/bloom-home-hero.webp?v=cb-rc2-audio1">
<link rel="preload" as="image" href="assets/bloom-home-logo.webp?v=cb-rc2-audio1">
<link rel="preload" as="image" href="assets/storybook-spring-atlas.webp?v=storybook1">

<link rel="stylesheet" href="bloom-visual.css?v=cb-rc2-storybook-sequence1">
<link rel="stylesheet" href="toy-blocks.css?v=cb-rc2-storybook-sequence1">
<link rel="preload" as="font" href="assets/fonts/gaegu-toys-bold.woff" type="font/woff" crossorigin>
<link rel="preload" as="font" href="assets/fonts/gaegu-bold.woff" type="font/woff" crossorigin>
</head>
<body>
<main id="app">
 <header class="topbar"><div><strong>크레용블룸</strong><small class="brand-en">CRAYON BLOOM</small><span id="mode-label">일반 · 무한 모드</span></div><button id="pause" aria-label="일시정지" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m8 5-.4 14M16 5l.4 14"/></svg></button></header>
 <section class="scorebar" aria-label="게임 기록">
  <div class="current-score"><span>SCORE</span><strong id="score">0</strong></div>
  <div><span>BEST</span><strong id="best">0</strong></div>
  <div><span id="pace-label">LEVEL 1</span><strong id="time">0:00</strong></div>
 </section>
 <section id="game-area" aria-label="게임판과 조작">
  <aside class="rail" aria-label="다음 블록과 조작 버튼">
   <button class="preview-card" data-preview="0" aria-label="다음 블록 확대"><span>NEXT</span><canvas id="next" width="120" height="100"></canvas></button>
   <button class="preview-card" data-preview="1" aria-label="두 번째 다음 블록 확대"><span>NEXT 2</span><canvas id="next2" width="120" height="100"></canvas></button>
   <div class="rail-space"></div>
   <button id="hold" class="hold-card" data-action="hold" aria-label="블록 보관"><span>HOLD</span><canvas id="held" width="120" height="80"></canvas></button>
   <button id="rotate" class="rotate-card" data-action="rotate" aria-label="블록 회전"><b aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M22 10a9 9 0 1 0 1 9M22 4v7h-7"/></svg></b><span>회전</span></button>
   <button id="drop" class="drop-card" data-action="drop" aria-label="블록 바로 내리기"><b aria-hidden="true"><svg viewBox="0 0 28 28"><path d="m14 3-.3 16M7 13l7 7 7-7M5 25h18"/></svg></b><span>쏙!</span></button>
  </aside>
  <div class="board-shell"><canvas id="board" width="360" height="720" aria-label="좌우 터치로 이동, 좌우 스와이프로 회전, 위 스와이프로 보관, 아래 스와이프로 즉시 하강하는 게임판" role="application"></canvas><div id="callout" role="status" aria-live="polite"></div></div>
 </section>
 <footer><span id="notice">좌우 터치 · 회전 · 즉시 하강</span><small id="build">CRAYON BLOOM · RC2 · CONTROL 23 FINAL · HOME RC2 · AUDIO 6</small></footer>
</main>
<div id="overlay" role="dialog" aria-modal="true" aria-label="게임 메뉴"><div id="panel" tabindex="-1"></div></div>
<p id="boot" role="status">게임을 불러오고 있습니다.</p>
<noscript>이 게임을 실행하려면 JavaScript를 켜 주세요.</noscript>

<script src="toy-blocks.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-item-art.js?v=cb-rc2-storybook-sequence1"></script>
<script src="crayon-bloom-fx.js?v=cb-rc2-storybook-sequence1"></script>
<script src="block-items.js?v=cb-rc2-storybook-sequence1"></script>
<script src="adaptive-director.js?v=cb-rc2-storybook-sequence1"></script>
<script src="adaptive-audit.js?v=cb-rc2-storybook-sequence1"></script>
<script src="adaptive-bridge.js?v=cb-rc2-storybook-sequence1"></script>
<script src="pointer-button-guard.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-audio.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-celebration.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-loading.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-tutorial.js?v=cb-rc2-storybook-sequence1"></script>
<script src="bloom-home.js?v=cb-rc2-storybook-sequence1"></script>
<script src="storybook.js?v=cb-rc2-storybook-sequence1"></script>
<script src="endless-app.js?v=cb-rc2-storybook-sequence1"></script>
</body>
</html>
