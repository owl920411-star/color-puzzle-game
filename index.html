<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Flower Bloom</title><style>
:root{--r:#ff626e;--b:#4d96ff;--y:#ffd93d;--p:#b983ff;--o:#ff9f45;--g:#6bcb77}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#bfe9ff,#eaf8d8 45%,#9ccc83);font-family:system-ui,sans-serif;color:#382b22;overflow:hidden}.app{max-width:430px;height:100vh;margin:auto;padding:10px;display:flex;flex-direction:column;gap:7px}.hud,.mission,.legend{background:linear-gradient(#fff6dc,#f5d9a5);border:2px solid #a96b34;box-shadow:0 3px #75451f;border-radius:15px}.hud{display:flex;align-items:center;gap:8px;padding:7px 10px}.stat{min-width:74px;text-align:center;font-weight:800}.small{font-size:10px;color:#8a623e}.big{font-size:20px}.timer{height:11px;flex:1;background:#ead5aa;border:1px solid #9d693a;border-radius:8px;overflow:hidden}.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#69ca73,#ffd74a,#ff6d6d)}.beat{width:11px;height:11px;background:#78998c;border-radius:50%;margin:auto}.beat.on{background:#ff9f45;transform:scale(1.7)}.mission{display:flex;justify-content:space-between;align-items:center;padding:8px 11px}.mission b{font-size:13px}.progress{font-size:16px;font-weight:900}.legend{display:flex;justify-content:center;gap:10px;padding:5px;font-size:11px;font-weight:800}.grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:5px;padding:8px;background:linear-gradient(145deg,#765333,#493522);border:7px solid #9b642f;outline:2px solid #d6a35e;border-radius:20px;box-shadow:0 6px #63401f}.cell{touch-action:none;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#4f7851,#2c5238);position:relative}.bud{width:62%;height:72%;border-radius:52% 52% 44% 44%;box-shadow:inset 7px 4px 10px #ffffff55,inset -6px -7px 9px #0002,0 4px 5px #0005;position:relative}.bud:after{content:"";position:absolute;left:12%;right:12%;bottom:-12%;height:30%;background:#4eb347;clip-path:polygon(0 100%,18% 15%,45% 67%,50% 0,58% 67%,86% 12%,100% 100%)}.flower{border-radius:50% 12% 50% 12%;box-shadow:12px 12px 0 currentColor,-12px -12px 0 currentColor,12px -12px 0 currentColor,-12px 12px 0 currentColor,0 0 20px #ffe899}.flower:after{content:"";left:35%;top:35%;width:30%;height:30%;border-radius:50%;background:#ffe36d}.pop{animation:pop .38s}.drop{animation:drop .22s}.shake{animation:shake .25s}@keyframes pop{50%{transform:scale(1.2)}}@keyframes drop{from{transform:translateY(-25px);opacity:0}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.harvest{height:28px;display:flex;gap:4px;overflow:hidden;background:#fff5d7aa;border:2px solid #b9783d;border-radius:10px;padding:4px}.dot{width:16px;height:16px;border-radius:50%;flex:none}.overlay{position:absolute;inset:0;background:linear-gradient(#eaf9e4f7,#fff0cdf7);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;z-index:5}.overlay h1{margin:4px}.overlay p{line-height:1.6}.btn{border:2px solid #467c32;border-radius:15px;background:linear-gradient(#a9e67c,#62bd55);box-shadow:0 4px #397232;padding:12px 28px;font-weight:900;font-size:16px}.hide{display:none}.float{position:absolute;z-index:9;font-weight:900;pointer-events:none;animation:up .6s forwards}.comboFx{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;font-weight:1000;text-shadow:0 3px 0 #fff,0 0 18px #ffd54a;font-size:34px;animation:comboBurst .55s forwards}.comboFx.hot{font-size:44px;text-shadow:0 3px 0 #fff,0 0 28px #ff8a00}.comboFx.mega{font-size:54px;text-shadow:0 3px 0 #fff,0 0 38px #ff3d81}.cell.comboGlow{animation:glow .42s}@keyframes up{to{transform:translateY(-35px);opacity:0}}@keyframes comboBurst{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.18);opacity:1}100%{transform:scale(.9) translateY(-30px);opacity:0}}@keyframes glow{50%{filter:brightness(1.6);box-shadow:0 0 22px #ffe66d}}
</style></head><body><div class="app" id="app"><div class="hud"><div class="stat"><div class="small">SCORE</div><div class="big" id="score">0</div><div class="small" id="combo">COMBO 0</div></div><div class="timer"><i id="bar"></i></div><div class="stat"><div class="small">TIME</div><div class="big" id="time">60</div></div></div><div class="beat" id="beat"></div><div class="mission" id="mission"><div><div class="small" id="stage">STAGE 1</div><b id="target">🎯 목표 꽃</b></div><div class="progress" id="progress"></div></div><div class="legend">🔴+🔵=🟣　🔴+🟡=🟠　🔵+🟡=🟢</div><div class="grid" id="grid"></div><div class="harvest" id="harvest"></div>
<div class="overlay" id="start"><div class="small" id="sStage"></div><h1>🌸 오늘의 개화 목표</h1><div class="big" id="sGoal"></div><p id="guide"></p><button class="btn" id="startBtn">시작하기</button><p class="small">↔ 탭 없이 스와이프로만 플레이</p></div>
<div class="overlay hide" id="end"><h1 id="endTitle"></h1><p id="result"></p><button class="btn" id="next">다음 스테이지</button><button class="btn" id="retry" style="margin-top:12px;background:#fff">다시 하기</button></div></div>
<script>
const C={red:'var(--r)',blue:'var(--b)',yellow:'var(--y)'},P=['red','blue','yellow'],F={purple:{e:'🟣',n:'보라꽃',c:'var(--p)',need:['red','blue'],r:'🔴+🔵'},orange:{e:'🟠',n:'주황꽃',c:'var(--o)',need:['red','yellow'],r:'🔴+🟡'},green:{e:'🟢',n:'초록꽃',c:'var(--g)',need:['blue','yellow'],r:'🔵+🟡'}},M={'blue,red':'purple','red,yellow':'orange','blue,yellow':'green'};
const ST=[{g:{purple:8},t:60,a:.28},{g:{orange:10},t:60,a:.25},{g:{green:12},t:60,a:.23},{g:{purple:8,green:6},t:55,a:.20},{g:{purple:7,orange:7,green:7},t:55,a:.16}],N=6;
let si=0,T=ST[0],board=[],goals={},score=0,time=60,combo=0,maxCombo=0,total=0,run=false,beatAt=0,timer,beatTimer,startIdx=null,sx=0,sy=0,busy=new Set(),lastFlower=null;
const $=x=>document.getElementById(x), entries=()=>Object.entries(T.g), done=()=>entries().every(([n,g])=>(goals[n]||0)>=g);
function goalText(){return entries().map(([n,g])=>F[n].e+' '+Math.min(goals[n]||0,g)+'/'+g).join('  ')}
function ui(){T=ST[si];$('stage').textContent=$('sStage').textContent='STAGE '+(si+1);$('target').textContent=entries().length>1?'🎯 여러 목표를 완성하세요':'🎯 목표 꽃을 피우세요';$('progress').textContent=goalText();$('sGoal').innerHTML=entries().map(([n,g])=>F[n].e+' '+F[n].n+' <b>'+g+'송이</b>').join('　');$('guide').innerHTML=[...new Set(entries().map(([n])=>F[n].r))].join(' / ')+'<br>⏱️ 제한시간 <b>'+T.t+'초</b><br><small>같은 꽃 2연속부터 콤보 · 매회 +0.2초</small>';if(done()){$('progress').textContent='✓ '+goalText();$('mission').animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:400})}}
function counts(){let c={red:0,blue:0,yellow:0};board.forEach(x=>x&&c[x.k]!=null&&c[x.k]++);return c}
function spawn(){if(Math.random()>.30)return P[Math.random()*3|0];let c=counts(),w={red:1,blue:1,yellow:1};entries().forEach(([f,g])=>{if((goals[f]||0)>=g)return;F[f].need.forEach(k=>w[k]+=Math.max(0,10-c[k])*.2+T.a*3)});let r=Math.random()*(w.red+w.blue+w.yellow);for(let k of P){r-=w[k];if(r<=0)return k}return'yellow'}
function build(){board=[];busy.clear();$('grid').innerHTML='';for(let i=0;i<36;i++){let k=P[Math.random()*3|0],el=document.createElement('div'),bud=document.createElement('div');el.className='cell';bud.className='bud';bud.style.background=C[k];el.append(bud);$('grid').append(el);board.push({k,el,bud});el.addEventListener('touchstart',e=>{if(!run||busy.has(i))return;let t=e.touches[0];startIdx=i;sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',e=>{if(startIdx==null||!run)return;let a=startIdx,t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,row=a/N,col=a%N,b=null;startIdx=null;if(Math.max(Math.abs(dx),Math.abs(dy))>=18){if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&col<5)b=a+1;if(dx<0&&col>0)b=a-1}else{if(dy>0&&row<5)b=a+6;if(dy<0&&row>0)b=a-6}}b!=null&&!busy.has(b)?merge(a,b):fail(a,a)},{passive:true})}}
function fail(a,b){combo=0;lastFlower=null;$('combo').textContent='COMBO 0';[a,b].forEach(i=>{if(!board[i])return;board[i].el.classList.add('shake');setTimeout(()=>board[i].el.classList.remove('shake'),260)})}
function floater(el,txt){let r=el.getBoundingClientRect(),q=$('app').getBoundingClientRect(),f=document.createElement('div');f.className='float';f.textContent=txt;f.style.left=r.left-q.left+10+'px';f.style.top=r.top-q.top+'px';$('app').append(f);setTimeout(()=>f.remove(),620)}
function merge(a,b){if(busy.has(a)||busy.has(b))return;let x=board[a].k,y=board[b].k,key=[x,y].sort().join(','),name=M[key];if(!name){fail(a,b);return}busy.add(a);busy.add(b);combo=(lastFlower===name)?combo+1:1;lastFlower=name;maxCombo=Math.max(maxCombo,combo);$('combo').textContent=(combo>=2?'🔥 ':'')+'COMBO '+combo;let target=T.g[name]!=null&&(goals[name]||0)<T.g[name],perfect=Date.now()-beatAt<260,mul=1+Math.min(combo-1,9)*.1,pts=Math.round((target?100:45)*(perfect?2:1)*mul/5)*5;score+=pts;total++;goals[name]=(goals[name]||0)+1;$('score').textContent=score;ui();if(combo>=2){time=Math.min(T.t+8,time+.2);let fx=document.createElement('div');fx.className='comboFx'+(combo>=8?' mega':combo>=5?' hot':'');fx.textContent=(combo>=8?'🌺 ':combo>=5?'✨ ':'🔥 ')+combo+' COMBO  +0.2s';$('app').append(fx);board[b].el.classList.add('comboGlow');setTimeout(()=>{fx.remove();board[b].el.classList.remove('comboGlow')},560)}floater(board[b].el,(perfect?'PERFECT! ':'')+(combo>=2?'🔥'+combo+' ':'')+(target?'🎯 ':'🌸 ')+'+'+pts);let d=document.createElement('i');d.className='dot';d.style.background=F[name].c;$('harvest').append(d);[a,b].forEach(i=>{board[i].k=null;board[i].bud.style.transform='scale(0)'});board[b].bud.style.transform='';board[b].bud.style.background=F[name].c;board[b].bud.style.color=F[name].c;board[b].bud.classList.add('flower');board[b].el.classList.add('pop');setTimeout(()=>[a,b].forEach(i=>{let k=spawn();board[i].k=k;board[i].bud.className='bud';board[i].bud.style='background:'+C[k];board[i].el.classList.remove('pop');board[i].el.classList.add('drop');setTimeout(()=>board[i].el.classList.remove('drop'),230);busy.delete(i)}),380)}
function begin(){goals={purple:0,orange:0,green:0};score=combo=maxCombo=total=0;lastFlower=null;time=T.t;$('score').textContent='0';$('combo').textContent='COMBO 0';$('time').textContent=T.t;$('bar').style.width='100%';$('harvest').innerHTML='';build();ui();$('start').classList.add('hide');$('end').classList.add('hide');run=true;beatAt=Date.now();clearInterval(beatTimer);beatTimer=setInterval(()=>{beatAt=Date.now();$('beat').classList.add('on');setTimeout(()=>$('beat').classList.remove('on'),160)},900);clearInterval(timer);timer=setInterval(()=>{time=Math.max(0,time-.1);$('time').textContent=Math.ceil(time);$('bar').style.width=Math.min(100,time/T.t*100)+'%';if(time<=0)finish()},100)}
function finish(){if(!run)return;run=false;clearInterval(timer);clearInterval(beatTimer);$('endTitle').textContent=done()?'🌸 STAGE CLEAR!':'조금만 더 피워볼까요?';$('result').textContent='최종 점수 '+score+' · '+goalText()+' · 전체 개화 '+total+'송이 · MAX COMBO '+maxCombo;$('next').style.display=done()?'block':'none';$('next').textContent=done()&&si===ST.length-1?'처음부터 다시':'다음 스테이지';$('end').classList.remove('hide')}
$('startBtn').onclick=begin;$('retry').onclick=begin;$('next').onclick=()=>{si=si<ST.length-1?si+1:0;T=ST[si];goals={purple:0,orange:0,green:0};ui();$('end').classList.add('hide');$('start').classList.remove('hide')};goals={purple:0,orange:0,green:0};ui();build();
</script></body></html>
