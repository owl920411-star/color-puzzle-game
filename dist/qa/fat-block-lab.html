<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><link rel="icon" href="data:,"><title>CRAYON BLOOM · 뚱뚱이 전용 실험실 · TOY V2</title><link rel="stylesheet" href="toy-lab.css?v=toy-v2"></head>
<body data-toy="fat"><main class="wrap"><section class="paper">
<header><h1>뚱뚱이의 장난 시간</h1><span>TOY V2 · 뚱뚱이</span></header><p class="sub">CRAYON BLOOM · 뚱뚱이 전용 실험실</p>
<div class="modes" aria-label="확인 방식"><button data-mode="repeat" aria-pressed="true">바로 반복</button><button data-mode="cycle" aria-pressed="false">1분 주기</button></div>
<div class="clockline"><span id="clock">바로 반복 · 매번 장난 블록</span><button id="pause">잠깐 쉬기</button></div>
<div class="stage"><canvas id="game" width="360" height="720" tabindex="0" aria-label="뚱뚱이 블록 10열 20행. 아래 버튼으로 조작하세요."></canvas></div>
<div class="controls"><button id="left">← 한 칸</button><button id="drop">쏙! 떨어뜨리기</button><button id="right">한 칸 →</button><button id="new">새 뚱뚱이</button><button id="fill">바닥 만들기</button><button id="clear">보드 비우기</button></div>
<p class="note">처음부터 빵빵한 볼과 배, <strong>뿌웅! → 짜잔!</strong><br>착지하면 원래 몸의 좌우 빈칸으로 한 번만 퍼져요.</p>
<p class="hint">보드를 톡 / 아래 스와이프: 쏙! · 좌우 스와이프: 한 칸<br>바닥 만들기·보드 비우기·방식 전환은 시간을 0부터 다시 시작해요.</p>
<details><summary>모습 비교 · 재현용 바닥</summary><canvas id="compare" class="compare" width="360" height="130" aria-label="같은 색과 모양의 일반 블록과 뚱뚱이 비교"></canvas><div class="compare-labels"><span>일반 블록</span><span>뚱뚱이</span></div><p class="hint">아래 버튼도 보드와 1분 주기를 다시 시작해요.</p><div class="terrains"><button data-terrain="flat">평평한 바닥</button><button data-terrain="steps">계단</button><button data-terrain="wall">한쪽 벽</button><button data-terrain="blocked">양쪽 막힘</button><button data-terrain="lower">옆이 낮음</button></div><button id="restart">다시 시작</button><p id="status" class="status" role="status" aria-live="polite"></p></details>
</section><footer>TOY V2 · 독립 프로토타입 · 자동 줄 제거 없음 · 기록 저장 안 함</footer></main>
